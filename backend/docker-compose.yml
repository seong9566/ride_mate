services:
  mysql:
    image: mysql:8.4
    container_name: ridemate-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ridemate
      MYSQL_USER: ridemate
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ridemate-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 초기화 중인 임시 서버는 TCP를 받지 않으므로 127.0.0.1로 확인한다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 24

  n8n:
    image: n8nio/n8n:2.47.3
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      TZ: Asia/Seoul
      GENERIC_TIMEZONE: Asia/Seoul
      TOPIS_API_KEY: "${TOPIS_API_KEY:-}"
      GITS_API_KEY: "${GITS_API_KEY:-}"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"

  # 배포용 API 서버. 개발 중에는 dotnet run을 쓰므로 --profile deploy를 줄 때만 뜬다
  api:
    profiles: ["deploy"]
    build: ./RideMateService/RideMateService
    container_name: ridemate-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Seoul
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=ridemate;User=ridemate;Password=${MYSQL_PASSWORD};CharSet=utf8mb4;"
      Jwt__Issuer: "${JWT_ISSUER:-}"
      Jwt__Audience: "${JWT_AUDIENCE:-}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-}"
      Crypto__PhoneEncKey: "${CRYPTO_PHONE_ENC_KEY:-}"
      Crypto__HashKey: "${CRYPTO_HASH_KEY:-}"
      Kakao__RestApiKey: "${KAKAO_REST_API_KEY:-}"
      Sms__Provider: "${SMS_PROVIDER:-Dev}"
      Sms__Solapi__ApiKey: "${SOLAPI_API_KEY:-}"
      Sms__Solapi__ApiSecret: "${SOLAPI_API_SECRET:-}"
      Sms__Solapi__Sender: "${SOLAPI_SENDER:-}"
      QrLogin__VerificationUri: "${PUBLIC_BASE_URL:-http://localhost:3000}/qr"
      PickupLink__BaseUrl: "${PUBLIC_BASE_URL:-http://localhost:3000}/p"
volumes:
  ridemate-mysql-data:
  n8n-data:
